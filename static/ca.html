const models = __models__
const canvas = document.querySelector('canvas');
const gl = canvas.getContext("webgl");

let W=mini?150:256,H=mini?32:256;  // Can only be increased slightly above 256...

const gui = new dat.GUI();
const param = {
  active: true,
  disturbance: false,
  clear_on_change: true,
  model: 0,
  zoom: mini?1:3.3,
  speed: 1.0,
};
const name2idx = Object.fromEntries(models.model_names.map((s, i) => [s, i]));
gui.add(param, 'model').options(name2idx).listen().onChange(()=>{
  ca.paint(0, 0, 1000, param.model);
  if (param.clear_on_change)
    ca.clearCircle(0, 0, 1000);
});

gui.add(param, 'active');
gui.add(param, 'disturbance');
gui.add(param, 'clear_on_change');
gui.add(param, 'zoom', 1.0, 32.0);
gui.add(param, 'speed', 0.2, 5.0);

gui.close();

let ca = new CA(gl, models, [W, H], gui);
ca.alignment = 0;

let counter = 0.0
function render() {
  if (param.active) {
    if (param.disturbance) {
      const t = 2.0*Date.now()/1000.0;
      ca.clearCircle(Math.sin(t*2.0)*W/3+W/2, Math.cos(t*3.1)*H/3+H/2, 20);
    }
    counter++;
    while(counter >= 1/param.speed) {
      ca.step();
      counter -= 1/param.speed;
    }
  }
  twgl.bindFramebufferInfo(gl);
  ca.draw(param.zoom);
  requestAnimationFrame(render);  
}

requestAnimationFrame(render);

function resize() {
  if (mini) {
    const f = 3;
    canvas.width = W * f;
    canvas.height = H * f;
    canvas.style['margin-left'] = `${(window.innerWidth - canvas.width)/2}px`;
    canvas.style['margin-top'] = `${(window.innerHeight - canvas.height)/2}px`;
    return;
  }
  if (window.innerWidth > window.innerHeight) {
    canvas.width = canvas.height = window.innerHeight;
    canvas.style['margin-left'] = `${(window.innerWidth - window.innerHeight)/2}px`;
    canvas.style['margin-top'] = 0;
  } else {
    canvas.width = canvas.height = window.innerWidth;
    canvas.style['margin-top'] = `${(window.innerHeight - window.innerWidth)/2}px`;
    canvas.style['margin-left'] = 0;
  }
}
window.addEventListener('resize', resize);
resize();

const observer = new IntersectionObserver((entries, observer) => {
  console.log('observed', entries);
});
observer.observe(canvas);

document.addEventListener('visibilitychange', () => {
  // Works when switching tabs, but not when switching apps.
  console.log('visible', document.visibilityState);
}, false);

// This messes up internal state in quite an interesting way...
canvas.addEventListener('click', () => {
  mini = !mini;
  let W = mini ? 150 : 256, H = mini ? 32 : 256;  // Can only be increased slightly above 256...
  param.zoom = mini?1:3.3;
  ca = new CA(gl, models, [W, H], gui);
  resize();
})
