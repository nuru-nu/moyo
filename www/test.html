<!docytpe HTML>

<head>
  <title>Nuru - Smoke and Mirrors</title>
  <link href="https://fonts.googleapis.com/css?family=Oxanium&display=swap" rel="stylesheet">
  <style type="text/css">
  body { margin: 0; padding: 0; }
  </style>
  <link rel="stylesheet" type="text/css" href="glider.css">
  <meta charset="utf-8">

<script type="module">

import { Scene, Nuru, Test, Mapping } from './nuru.js';

const container = document.createElement('div')
document.body.appendChild(container)

const scene = Scene(container)
const nuru = Nuru(scene)
let mapping
nuru.onready.then(() => {
  mapping = Mapping(nuru.obj())
  return mapping.onready
}).then(() => fetch('3D/test.json')
).then(res => res.json()
).then(values => mapping.load(values)
)
scene.animate()

// Test()

</script>
