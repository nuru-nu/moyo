<!docytpe HTML>

<head>
  <title>Nuru - Smoke and Mirrors</title>
  <link href="https://fonts.googleapis.com/css?family=Oxanium&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="stylesheet" type="text/css" href="glider.css">
  <meta charset="utf-8">

<script type="module">

import * as THREE from './three.module.js';

import Stats from './stats.module.js';

import { PLYLoader } from './PLYLoader.js';
import { TDSLoader } from './TDSLoader.js';
import { OBJLoader } from './OBJLoader.js';
import { TrackballControls } from './TrackballControls.js';


var container, stats;

var camera, cameraTarget, scene, renderer, controls;

init();
animate();

function init() {

  container = document.createElement( 'div' );
  document.body.appendChild( container );

  // camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 1, 15 );
  camera = new THREE.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 0.1, 10 );
  // camera.position.set( 3, 0.15, 3 );
  // camera.position.set( 1, 1, 1 );
  camera.position.z = 2;

  cameraTarget = new THREE.Vector3( 0, 0, 0 );

  scene = new THREE.Scene();
  // scene.background = new THREE.Color( 0x72645b );
  scene.fog = new THREE.Fog( 0x72645b, 2, 15 );

  // Ground
  var plane = new THREE.Mesh(
    new THREE.PlaneBufferGeometry( 40, 40 ),
    new THREE.MeshPhongMaterial( { color: 0x999999, specular: 0x101010 } )
  );
  plane.rotation.x = - Math.PI / 2;
  plane.position.y = - 0.5;
  // scene.add( plane );

  plane.receiveShadow = true;

  if (false) {
    let loader = new PLYLoader();

    loader.load( './dolphins.ply', function ( geometry ) {

      geometry.computeVertexNormals();

      var material = new THREE.MeshStandardMaterial( { color: 0x0055ff, flatShading: true } );
      var mesh = new THREE.Mesh( geometry, material );

      mesh.position.y = - 0.2;
      mesh.position.z = 0.3;
      mesh.rotation.x = - Math.PI / 2;
      mesh.scale.multiplyScalar( 0.001 );

      mesh.castShadow = true;
      mesh.receiveShadow = true;

      scene.add( mesh );
    } );

  }

  if (false) {
    let loader = new PLYLoader();

    loader.load( './pcl_2020_03_04_21_03_06_352_WIP.ply', function ( geometry ) {

      geometry.computeVertexNormals();

      var material = new THREE.MeshStandardMaterial( { color: 0x0055ff, flatShading: true } );
      var mesh = new THREE.Mesh( geometry, material );

      mesh.position.y = - 0.2;
      mesh.position.z = 0.3;
      mesh.rotation.x = - Math.PI / 2;
      mesh.scale.multiplyScalar( 0.001 );

      mesh.castShadow = true;
      mesh.receiveShadow = true;

      scene.add( mesh );
    } );

  }

  if (false) {
    let loader = new TDSLoader( );
    // loader.setResourcePath( 'models/3ds/portalgun/textures/' );
    loader.load( 'pcl_2020_03_04_21_03_06_352_WIP.3ds', function ( object ) {

      object.traverse( function ( child ) {

        console.log(child);

        // if ( child.isMesh ) {
        //   child.material.normalMap = normal;
        // }

      } );

      scene.add( object );

    } );
  }

  if (false) {
    let manager = new THREE.LoadingManager( loadModel );
    let loader = new OBJLoader( manager );
    var object;
    loader.load( 'pcl_2020_03_04_21_03_06_352_WIP.obj', function ( obj ) {
      object = obj;
    }, onProgress, onError );
    function loadModel() {
      if (!object) { console.log('loadModel w/o object'); return }
      object.traverse(function (child) {
        console.log('obj child', child);
      });
      scene.add(object);
    }
    function onError() { console.log('onError') }
    function onProgress() { console.log('onProgress') }
  }

  if (true) {
    let manager = new THREE.LoadingManager( loadModel );
    let loader = new OBJLoader( manager );
    var object;
    loader.load( 'kinect_lowres.obj', function ( obj ) {
      object = obj;
    }, onProgress, onError );
    function loadModel() {
      if (!object) { console.log('loadModel w/o object'); return }
      object.traverse(function (child) {
        console.log('obj child', child);
      });
      scene.add(object);
    }
    function onError() { console.log('onError') }
    function onProgress() { console.log('onProgress') }
  }

  if (false) {
    loader.load( './Lucy100k.ply', function ( geometry ) {

      geometry.computeVertexNormals();

      var material = new THREE.MeshStandardMaterial( { color: 0x0055ff, flatShading: true } );
      var mesh = new THREE.Mesh( geometry, material );

      mesh.position.x = - 0.2;
      mesh.position.y = - 0.02;
      mesh.position.z = - 0.2;
      mesh.scale.multiplyScalar( 0.0006 );

      mesh.castShadow = true;
      mesh.receiveShadow = true;

      scene.add( mesh );
    } );
  }

  // Lights
  scene.add( new THREE.HemisphereLight( 0x443333, 0x111122 ) );
  addShadowedLight( 1, 1, 1, 0xffffff, 1.35 );
  addShadowedLight( 0.5, 1, - 1, 0xffaa00, 1 );

  // renderer
  renderer = new THREE.WebGLRenderer( { antialias: true } );
  renderer.setPixelRatio( window.devicePixelRatio );
  renderer.setSize( window.innerWidth, window.innerHeight );
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  container.appendChild( renderer.domElement );

  // stats
  stats = new Stats();
  container.appendChild( stats.dom );

  controls = new TrackballControls( camera, renderer.domElement );

  // resize
  window.addEventListener( 'resize', onWindowResize, false );
}

function addShadowedLight( x, y, z, color, intensity ) {
  var directionalLight = new THREE.DirectionalLight( color, intensity );
  directionalLight.position.set( x, y, z );
  scene.add( directionalLight );

  directionalLight.castShadow = true;

  var d = 1;
  directionalLight.shadow.camera.left = - d;
  directionalLight.shadow.camera.right = d;
  directionalLight.shadow.camera.top = d;
  directionalLight.shadow.camera.bottom = - d;

  directionalLight.shadow.camera.near = 1;
  directionalLight.shadow.camera.far = 4;

  directionalLight.shadow.mapSize.width = 1024;
  directionalLight.shadow.mapSize.height = 1024;

  directionalLight.shadow.bias = - 0.001;
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize( window.innerWidth, window.innerHeight );
}

function animate() {
  requestAnimationFrame( animate );
  render();
  stats.update();
}

function render() {
  var timer = Date.now() * 0.0005;
  // camera.position.x = Math.sin( timer ) * 2.5;
  // camera.position.z = Math.cos( timer ) * 2.5;
  // camera.lookAt( cameraTarget );
  controls.update();
  renderer.render( scene, camera );
}

</script>
